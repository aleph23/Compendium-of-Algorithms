name: "Compendium of Algorithms — Biweekly Assembler"

on:
 # schedule:
   # - cron: "0 4 1,15 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Generation mode"
        required: false
        default: "incremental"
        type: choice
        options:
          - "incremental"
          - "all"
      skip_research:
        description: "Skip research phase (use cached context)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write   # needed for release creation and branch push

jobs:
  assemble-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout directive branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install anthropic

      # State caches
      - name: Restore assembler state cache
        uses: actions/cache@v4
        with:
          path: .assembler_state.json
          key: assembler-state-${{ github.run_id }}
          restore-keys: assembler-state-

      - name: Restore research context cache
        uses: actions/cache@v4
        with:
          path: research_context.json
          key: research-context-${{ github.run_id }}
          restore-keys: research-context-

      - name: Restore frontier version cache
        uses: actions/cache@v4
        with:
          path: frontier_version.json
          key: frontier-version-${{ github.run_id }}
          restore-keys: frontier-version-

      # PHASE 1: Research
      # arXiv crawl + Papers With Code + Claude web_search emergent scan.
      # Writes research_context.json consumed by the assembler.
      - name: Run Research Agent
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        if: github.event.inputs.skip_research != 'true'
        run: python scripts/research.py --days 14

      - name: Summarise emergent candidates
        if: github.event.inputs.skip_research != 'true'
        run: |
          python - << 'PYEOF'
          import json, pathlib
          path = pathlib.Path("research_context.json")
          if not path.exists():
              exit(0)
          ctx   = json.loads(path.read_text())
          cands = ctx.get("emergent", {}).get("candidates", [])
          print(f"\n{'='*60}")
          print(f"  NEW: {len(cands)} emergent candidate(s) — copy to topics_registry.py")
          print(f"{'='*60}")
          for c in cands:
              print(f"  [{c.get('era','')}] {c.get('title','')}")
          PYEOF

      # PHASE 2: Assembly
      # Writes only to src/content/docs/frontier/ (canon guard enforced).
      - name: Run AI Assembler
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'incremental' }}"
          if [ "$MODE" = "all" ]; then
            python scripts/assemble_tome.py --all --bootstrap --target received-canon
          else
            python scripts/assemble_tome.py
          fi

      # PHASE 3: Version management
      # Computes character-count delta against baseline.
      # Exit 0  → normal (no archive needed)
      # Exit 2  → ≥15% content reduction → archive this version
      - name: Run Version Manager
        id: versioning
        run: |
          set +e
          python scripts/version_manager.py
          VERSION_EXIT=$?
          set -e

          # Read version for use in later steps
          VERSION=$(python -c "
          import json, pathlib
          v = json.loads(pathlib.Path('frontier_version.json').read_text())
          print(f\"{v['major']}.{v['minor']}\")
          ")
          echo "frontier_version=$VERSION"     >> $GITHUB_OUTPUT
          echo "archive_triggered=$( [ $VERSION_EXIT -eq 2 ] && echo true || echo false )" >> $GITHUB_OUTPUT
          echo "Frontier version: $VERSION"
          echo "Archive triggered: $( [ $VERSION_EXIT -eq 2 ] && echo YES || echo no )"

      # PHASE 4: Build
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '`24.x'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build Starlight site
        run: npm run build
        # frontier_version.json is copied into dist/ so the client JS badge can fetch it

      - name: Copy version file into dist
        run: |
          cp frontier_version.json dist/frontier_version.json 2>/dev/null || true

