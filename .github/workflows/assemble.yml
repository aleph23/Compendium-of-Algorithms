      # PHASE 6: Publish to compendium branch
      - name: Publish to compendium branch
        run: |
          git config --global user.name  "Compendium Assembler"
          git config --global user.email "assembler@github.com"

          cp -r dist /tmp/compendium-dist
          cp .assembler_state.json  /tmp/assembler_state.json  2>/dev/null || true
          cp research_context.json  /tmp/research_context.json 2>/dev/null || true
          cp frontier_version.json  /tmp/frontier_version.json 2>/dev/null || true

          git checkout -B compendium
          git rm -rf --cached . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          cp -r /tmp/compendium-dist/. .
          rm -rf /tmp/compendium-dist

          # Restore state files for next incremental run
          cp /tmp/assembler_state.json  .assembler_state.json  2>/dev/null || true
          cp /tmp/research_context.json research_context.json  2>/dev/null || true
          cp /tmp/frontier_version.json frontier_version.json  2>/dev/null || true

          cat > README.md << 'EOF'
          Compendium of Algorithms
          The Formal Specification and Structural Composition of Probabilistic
          Computational Systems and Their Occasional Interdependence

          Open index.html to read locally.
          Liber Primus - The Received Canon  |  Liber Levitatis et Inconstantiae - Frontier

          This branch is auto-generated. See directive branch for source scripts.
          EOF

          FRONTIER_VERSION="${{ steps.versioning.outputs.frontier_version }}"
          git add -A
          git commit -m "Compendium update $(date +'%Y-%m-%d') — Frontier v${FRONTIER_VERSION}" \
            || echo "Nothing to commit"
          git push origin compendium --force

      # PHASE 7: Upload artifacts & deploy to GitHub Pages:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: compendium-${{ github.run_number }}-frontier-v${{ steps.versioning.outputs.frontier_version }}
          path: /tmp/compendium-dist
          retention-days: 30
